<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poker App</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Poker App">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: #0f172a;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 90%;
      max-width: 400px;
    }
    .hidden { display: none !important; }

    h1 { font-size: 2.2rem; margin-bottom: 10px; }

    button {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    button.secondary { background: #334155; }
    button.action { background: #16a34a; }

    .table {
      width: 90%;
      max-width: 800px;
      height: 350px;
      background: #15803d;
      border: 10px solid #78350f;
      border-radius: 200px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }
    .cards { display: flex; gap: 8px; }
    .card {
      width: 45px;
      height: 65px;
      background: white;
      color: black;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 1. MENU PRINCIPAL -->
  <div id="main-menu" class="screen">
    <h1>Poker App</h1>
    <button onclick="showScreen('mode-menu')">Créer une partie</button>
    <button class="secondary" onclick="showScreen('join-menu')">Rejoindre une partie</button>
  </div>

  <!-- 2. CHOIX DU MODE DE JEU -->
  <div id="mode-menu" class="screen hidden">
    <h2>Mode de jeu</h2>
    <button onclick="startGame('Tablette solo / Pass & Play')">📱 100% sur cette tablette</button>
    <button class="action" onclick="startGame('Multijoueur Téléphones')">📲 Avec téléphones (Room)</button>
    <button class="secondary" onclick="showScreen('main-menu')">Retour</button>
  </div>

  <!-- 3. REJOINDRE -->
  <div id="join-menu" class="screen hidden">
    <h2>Rejoindre</h2>
    <input type="text" placeholder="Code de la partie" style="width:100%; padding:14px; border-radius:8px; border:none; text-align:center; font-size:1.2rem;">
    <button class="action" onclick="startGame('Rejoint')">Rejoindre</button>
    <button class="secondary" onclick="showScreen('main-menu')">Retour</button>
  </div>

  <!-- 4. TABLE DE JEU -->
  <div id="game-screen" class="screen hidden" style="max-width:900px;">
    <h3 id="game-mode-title">Partie en cours</h3>
    <div class="table">
      <div class="cards">
        <div class="card">A♠</div>
        <div class="card">K♥</div>
        <div class="card">10♠</div>
      </div>
    </div>
    <button class="secondary" onclick="showScreen('main-menu')">Quitter la partie</button>
  </div>

  <script>
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
      document.getElementById(id).classList.remove('hidden');
    }

    function startGame(mode) {
      document.getElementById('game-mode-title').innerText = "Mode : " + mode;
      showScreen('game-screen');
    }
  </script>
</body>
</html>
