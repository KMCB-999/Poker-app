<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Scoreboard</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b131e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .screen { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; padding: 20px; text-align: center; position: absolute; top: 0; left: 0; background: #0b131e; }
        .screen.active { display: flex; }
        h1 { font-size: 26px; margin-bottom: 20px; color: #f1c40f; }
        .input-group { width: 100%; max-width: 320px; margin-bottom: 15px; }
        label { display: block; text-align: left; font-size: 13px; color: #bdc3c7; margin-bottom: 5px; margin-left: 5px; }
        input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #2c3e50; background: #16222a; color: #fff; font-size: 16px; text-align: center; outline: none; }
        .btn { width: 100%; max-width: 320px; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        .btn-primary { background: #e74c3c; }
        .btn-secondary { background: #2980b9; }
        .btn:active { transform: scale(0.96); }

        /* Écran de Jeu / Table Centrale */
        #game-screen { background: radial-gradient(circle, #1b4d3e 0%, #0d231b 100%); justify-content: space-between; padding: 15px; }
        .table-header { display: flex; justify-content: space-between; width: 100%; font-size: 14px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; align-items: center; }
        .table-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex: 1; width: 100%; max-width: 400px; margin: 0 auto; }
        .pot-container { background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 20px; border: 2px solid #f1c40f; width: 100%; }
        .pot-label { font-size: 14px; color: #bdc3c7; text-transform: uppercase; letter-spacing: 1px; }
        .pot-amount { font-size: 36px; color: #f1c40f; font-weight: bold; }
        .round-indicator { font-size: 15px; color: #2ecc71; font-weight: bold; background: rgba(46, 204, 113, 0.2); padding: 6px 15px; border-radius: 10px; }
        
        .players-list { width: 100%; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; max-height: 160px; overflow-y: auto; text-align: left; }
        .player-row { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; }
        .player-row:last-child { border-bottom: none; }
        
        .control-panel { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; margin: 0 auto; }
        .action-row { display: flex; gap: 8px; }
        .action-row button { flex: 1; padding: 12px 5px; border-radius: 8px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; color: white; }
        .btn-bet { background: #d35400; }
        .btn-next { background: #27ae60; }
        .btn-reset { background: #c0392b; }
        
        .host-controls { display: none; }
        #player-controls { display: none; width: 100%; flex-direction: column; gap: 8px; }
    </style>
</head>
<body>

    <!-- 1. MENU PRINCIPAL -->
    <div id="menu-screen" class="screen active">
        <h1>POKER TENT</h1>
        <div class="input-group">
            <label>Ton Pseudo (Si tu rejoins en Joueur)</label>
            <input type="text" id="username" placeholder="Ex: Thomas">
        </div>
        <div class="input-group">
            <label>Code de la table</label>
            <input type="text" id="room-code" placeholder="Ex: 777" value="777">
        </div>
        
        <button class="btn btn-primary" onclick="createHostTable()">🖥️ Créer la Table (iPad / Hôte)</button>
        <button class="btn btn-secondary" onclick="joinAsPlayer()">📱 Rejoindre (Téléphone / Joueur)</button>
    </div>

    <!-- 2. TABLE DE JEU -->
    <div id="game-screen" class="screen">
        <div class="table-header">
            <span id="info-room" style="font-weight: bold; color: #f1c40f;">Table #</span>
            <span id="info-role" style="color: #2ecc71; font-weight: bold;"></span>
            <button onclick="backToMenu()" style="background: none; border: none; color: #e74c3c; font-weight: bold; cursor: pointer; font-size: 13px;">Quitter</button>
        </div>

        <div class="table-center">
            <div class="round-indicator" id="round-name">Phase : Pré-Flop</div>
            <div class="pot-container">
                <div class="pot-label">Pot Total</div>
                <div class="pot-amount" id="pot-display">0</div>
            </div>

            <div class="players-list" id="players-container"></div>
        </div>

        <!-- Contrôles Hôte (iPad) -->
        <div class="control-panel host-controls" id="host-controls-panel">
            <div class="action-row">
                <button class="btn-next" onclick="nextPhase()">Tour Suivant</button>
                <button class="btn-reset" onclick="resetHand()">Réinitialiser le Pot</button>
            </div>
        </div>

        <!-- Contrôles Joueur (Téléphone) -->
        <div class="control-panel" id="player-controls">
            <div style="font-size: 13px; color: #f1c40f; margin-bottom: 2px;" id="my-chips-text">Mes jetons : 1000</div>
            <div class="action-row">
                <button class="btn-bet" onclick="addChipsToPot(10)">Miser 10</button>
                <button class="btn-bet" onclick="addChipsToPot(50)">Miser 50</button>
                <button class="btn-bet" onclick="addChipsToPot(100)">Miser 100</button>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = {
        databaseURL: "https://poker-app-sync-default-rtdb.europe-west1.firebasedatabase.app/"
    };
    let db = null;
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
    } catch(e) { console.log("Firebase erreur init"); }

    let currentRoom = "777";
    let playerName = "";
    let isHost = false;
    let roomRef = null;
    const phases = ["Pré-Flop", "Flop (3 cartes)", "Turn (4ème carte)", "River (Dernière carte)"];

    function createHostTable() {
        const roomInput = document.getElementById('room-code').value.trim();
        if(!roomInput) { alert("Entre un code de table !"); return; }

        currentRoom = roomInput;
        isHost = true;

        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('info-room').innerText = "Table #" + currentRoom;
        document.getElementById('info-role').innerText = "🖥️ Mode Hôte (iPad)";
        
        document.getElementById('host-controls-panel').style.display = "flex";
        document.getElementById('player-controls').style.display = "none";

        setupSync();
    }

    function joinAsPlayer() {
        const nameInput = document.getElementById('username').value.trim();
        const roomInput = document.getElementById('room-code').value.trim();

        if(!nameInput) { alert("Entre ton pseudo !"); return; }
        if(!roomInput) { alert("Entre un code de table !"); return; }

        playerName = nameInput;
        currentRoom = roomInput;
        isHost = false;

        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('info-room').innerText = "Table #" + currentRoom;
        document.getElementById('info-role').innerText = "👤 " + playerName;

        document.getElementById('host-controls-panel').style.display = "none";
        document.getElementById('player-controls').style.display = "flex";

        setupSync();

        // Enregistre ou initialise le joueur dans la room sans écraser les autres
        const playerRef = db.ref('rooms/' + currentRoom + '/players/' + sanitizeKey(playerName));
        playerRef.once('value', (snapshot) => {
            if (!snapshot.exists()) {
                playerRef.set({ name: playerName, chips: 1000 });
            }
        });
        // Sécurité déconnexion optionnelle ou nettoyage si besoin
    }

    function sanitizeKey(str) {
        return str.replace(/[.#$\/\[\]]/g, "_");
    }

    function setupSync() {
        roomRef = db.ref('rooms/' + currentRoom);

        // Écoute globale de la room (pot, phase, joueurs)
        roomRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            let pot = data.pot || 0;
            let phaseIndex = data.phaseIndex || 0;

            document.getElementById('pot-display').innerText = pot;
            document.getElementById('round-name').innerText = "Phase : " + (phases[phaseIndex] || "Pré-Flop");

            let playersHtml = '';
            let myChips = 1000;
            if (data.players) {
                Object.keys(data.players).forEach(key => {
                    let p = data.players[key];
                    playersHtml += `<div class="player-row"><span>👤 ${p.name}</span><span><strong>${p.chips}</strong> jetons</span></div>`;
                    if (!isHost && key === sanitizeKey(playerName)) {
                        myChips = p.chips;
                    }
                });
            }
            document.getElementById('players-container').innerHTML = playersHtml;

            if (!isHost) {
                document.getElementById('my-chips-text').innerText = "Mes jetons : " + myChips;
            }
        });
    }

    function addChipsToPot(amount) {
        if (isHost || !playerName) return;

        const safeName = sanitizeKey(playerName);
        const roomPath = db.ref('rooms/' + currentRoom);

        roomPath.transaction((room) => {
            if (room) {
                room.pot = (room.pot || 0) + amount;
                if (room.players && room.players[safeName]) {
                    let currentChips = room.players[safeName].chips || 1000;
                    room.players[safeName].chips = Math.main ? Math.max(0, currentChips - amount) : Math.max(0, currentChips - amount);
                }
            }
            return room;
        });
    }

    function nextPhase() {
        if (!isHost) return;
        roomRef.child('phaseIndex').transaction((currentPhase) => {
            return ((currentPhase || 0) + 1) % phases.length;
        });
    }

    function resetHand() {
        if (!isHost) return;
        roomRef.child('pot').set(0);
        roomRef.child('phaseIndex').set(0);
    }

    function backToMenu() {
        if (roomRef) roomRef.off();
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('menu-screen').classList.add('active');
    }
</script>
</body>
</html>
