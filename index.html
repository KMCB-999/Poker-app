<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poker Scoreboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b131e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .screen { display: none; flex-direction: column; justify-content: center; align-items: center; height: 100%; width: 100%; padding: 20px; text-align: center; position: absolute; top: 0; left: 0; background: #0b131e; }
        .screen.active { display: flex; }
        h1 { font-size: 26px; margin-bottom: 20px; color: #f1c40f; }
        input { width: 100%; max-width: 300px; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #2c3e50; background: #16222a; color: #fff; font-size: 16px; text-align: center; outline: none; }
        .btn { width: 100%; max-width: 300px; padding: 14px; margin-bottom: 12px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        .btn-primary { background: #e74c3c; }
        .btn-secondary { background: #2980b9; }
        .btn-success { background: #27ae60; }
        .btn:active { transform: scale(0.96); }

        #game-screen { background: radial-gradient(circle, #1b4d3e 0%, #0d231b 100%); justify-content: space-between; padding: 15px; }
        .table-header { display: flex; justify-content: space-between; width: 100%; font-size: 14px; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 10px; }
        .table-center { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; flex: 1; }
        .pot-container { background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 20px; border: 2px solid #f1c40f; }
        .pot-label { font-size: 14px; color: #bdc3c7; text-transform: uppercase; letter-spacing: 1px; }
        .pot-amount { font-size: 32px; color: #f1c40f; font-weight: bold; }
        .round-indicator { font-size: 16px; color: #2ecc71; font-weight: bold; background: rgba(46, 204, 113, 0.2); padding: 5px 15px; border-radius: 10px; }
        
        .players-list { width: 100%; max-width: 400px; background: rgba(0,0,0,0.3); border-radius: 12px; padding: 10px; max-height: 180px; overflow-y: auto; text-align: left; }
        .player-row { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 15px; }
        .player-row:last-child { border-bottom: none; }
        
        .control-panel { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 400px; }
        .action-row { display: flex; gap: 8px; }
        .action-row button { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; color: white; }
        .btn-bet { background: #d35400; }
        .btn-next { background: #27ae60; }
        .btn-reset { background: #c0392b; }
    </style>
</head>
<body>

    <div id="menu-screen" class="screen active">
        <h1>POKER TENT</h1>
        <input type="text" id="username" placeholder="Ton pseudo" value="Joueur 1">
        <button class="btn btn-primary" onclick="createRoom()">Créer la table</button>
        <button class="btn btn-secondary" onclick="joinRoomPrompt()">Rejoindre une table</button>
    </div>

    <div id="game-screen" class="screen">
        <div class="table-header">
            <span id="info-room">Table #101</span>
            <span id="info-player">Joueur</span>
        </div>

        <div class="table-center">
            <div class="round-indicator" id="round-name">Phase : Pré-Flop</div>
            <div class="pot-container">
                <div class="pot-label">Pot Total</div>
                <div class="pot-amount" id="pot-display">0</div>
            </div>

            <div class="players-list" id="players-container"></div>
        </div>

        <div class="control-panel">
            <div class="action-row">
                <button class="btn-bet" onclick="addChipsToPot(10)">+10 Jetons</button>
                <button class="btn-bet" onclick="addChipsToPot(50)">+50 Jetons</button>
                <button class="btn-bet" onclick="addChipsToPot(100)">+100 Jetons</button>
            </div>
            <div class="action-row">
                <button class="btn-next" onclick="nextPhase()">Tour Suivant</button>
                <button class="btn-reset" onclick="resetHand()">Fin de coup</button>
            </div>
        </div>
    </div>

<script>
    let roomCode = "101", playerName = "", pot = 0, phaseIndex = 0;
    const phases = ["Pré-Flop", "Flop", "Turn", "River"];
    let players = [{ name: "Joueur 1", chips: 1000 }, { name: "Pote 2", chips: 1000 }];

    function createRoom() {
        const n = document.getElementById('username').value.trim();
        if(!n) return alert("Pseudo requis");
        playerName = n; players[0].name = playerName;
        roomCode = Math.floor(100 + Math.random() * 900);
        initGameScreen();
    }

    function joinRoomPrompt() {
        const n = document.getElementById('username').value.trim();
        if(!n) return alert("Pseudo requis");
        playerName = n;
        let c = prompt("Numéro de table :");
        if(!c) return;
        roomCode = c;
        if(!players.some(p => p.name === playerName)) players.push({ name: playerName, chips: 1000 });
        initGameScreen();
    }

    function initGameScreen() {
        document.getElementById('menu-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        document.getElementById('info-room').innerText = "Table #" + roomCode;
        document.getElementById('info-player').innerText = playerName;
        updateUI();
    }

    function updateUI() {
        document.getElementById('pot-display').innerText = pot;
        document.getElementById('round-name').innerText = "Phase : " + phases[phaseIndex];
        let html = '';
        players.forEach(p => { html += `<div class="player-row"><span>👤 ${p.name}</span><span><strong>${p.chips}</strong></span></div>`; });
        document.getElementById('players-container').innerHTML = html;
    }

    function addChipsToPot(a) {
        pot += a;
        let p = players.find(x => x.name === playerName);
        if(p && p.chips >= a) p.chips -= a;
        updateUI();
    }

    function nextPhase() {
        if(phaseIndex < phases.length - 1) phaseIndex++;
        else phaseIndex = 0;
        updateUI();
    }

    function resetHand() { pot = 0; phaseIndex = 0; updateUI(); }
</script>
</body>
</html>
